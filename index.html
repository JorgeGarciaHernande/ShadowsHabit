<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Hábitos</title>
<meta name="theme-color" content="#eaf0ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Shadow Hábitos: la versión deportiva de Shadow. Mismo perro, otra vida: verde de pista en vez del ámbar del NOC */
:root{
  --bg:#eaf0ed; --surface:#fbfdfc; --surface-2:#e0e8e4; --ink:#14211c; --muted:#55665e; --line:#cfdbd5;
  --accent:#16795f; --accent-ink:#f2fffa; --accent-soft:#d3ece2;
  --cable:#2b5fa3; --water:#2f86d6; --good:#23794b; --good-soft:#d9eee1; --bad:#b4372f; --bad-soft:#f5dad6; --warn:#a8621a; --warn-soft:#f2e1ca;
  --rug:#d3dcc4;
  --f-display: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Segoe UI", system-ui, sans-serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
  --f-mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", "Fira Code", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1513; --surface:#17201c; --surface-2:#212c27; --ink:#e5ede9; --muted:#93a59c; --line:#2b3832;
    --accent:#3ccf9e; --accent-ink:#05241a; --accent-soft:#163a2d;
    --cable:#70a3e6; --water:#5aa9ec; --good:#4cc286; --good-soft:#163426; --bad:#ef7068; --bad-soft:#3d1d1b; --warn:#e19a4b; --warn-soft:#3a2a17;
    --rug:#26302a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#17201c; --surface-2:#212c27; --ink:#e5ede9; --muted:#93a59c; --line:#2b3832;
  --accent:#3ccf9e; --accent-ink:#05241a; --accent-soft:#163a2d;
  --cable:#70a3e6; --water:#5aa9ec; --good:#4cc286; --good-soft:#163426; --bad:#ef7068; --bad-soft:#3d1d1b; --warn:#e19a4b; --warn-soft:#3a2a17;
  --rug:#26302a; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
a{color:var(--cable)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cable);outline-offset:2px}

.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:8px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.prompt{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:1.4rem;letter-spacing:-.01em}
.brand-tag{font-family:var(--f-mono);font-size:.72rem;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.hstats{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.84rem;color:var(--muted)}
.hchip b{color:var(--ink);font-variant-numeric:tabular-nums}
.hchip.on{color:var(--accent);border-color:var(--accent)}
.hchip.on b{color:var(--accent)}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.syncdot{width:10px;height:10px;border-radius:99px;background:var(--line);display:inline-block}
.syncdot.ok{background:var(--good)}
.syncdot.busy{background:var(--water)}
.syncdot.err,.syncdot.login{background:var(--warn)}

nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.is-on{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:460px){.tab{padding:10px 8px;font-size:.88rem}}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:.72rem;font-family:var(--f-mono)}

.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.panel{position:sticky;top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bubble{position:relative;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:.95rem;min-height:3.2em}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:8px solid transparent;border-bottom:0;border-top-color:var(--surface-2)}
.rug{background:radial-gradient(ellipse 40% 9% at 50% 91%,var(--rug) 0 97%,transparent 100%);padding-top:6px}
#dogwrap{max-width:240px;margin:0 auto}
.dog-meta{display:flex;flex-direction:column;gap:6px}
.dog-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dog-name b{font-family:var(--f-display);font-size:1.1rem}
.dog-name span{font-size:.8rem;color:var(--muted)}
.mini-lbl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:14px}
  .panel{position:static;display:grid;grid-template-columns:110px minmax(0,1fr);grid-template-areas:"dog bubble" "dog meta";column-gap:12px;row-gap:8px;align-items:center;padding:12px}
  .rug{grid-area:dog}
  .bubble{grid-area:bubble}
  .bubble::after{left:-8px;top:16px;bottom:auto;transform:none;border:8px solid transparent;border-left:0;border-right-color:var(--surface-2)}
  .dog-meta{grid-area:meta}
}

main{min-width:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:1.08rem}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.sm{font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:.84rem;color:var(--muted)}
.err{color:var(--bad);font-weight:600;font-size:.9rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.water{background:var(--water);border-color:var(--water);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:.85rem}
.link{background:none;border:0;padding:0;color:var(--cable);cursor:pointer;font-weight:600;font-size:.9rem}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0;width:100%}
textarea.inp{min-height:110px;resize:vertical;font-family:var(--f-mono);font-size:14px}
.inl{display:flex;gap:8px}
.inl .inp{flex:1}
.field{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:600}
.field small{font-weight:400;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.softbar{display:block;width:100%;text-align:left;border:1px dashed var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
.warnbar{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-weight:600;margin-bottom:12px}
.editing{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:.9rem}

/* Día */
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.daycard.prime{background:var(--accent-soft);border-color:transparent}
.daytop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:800;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1.2rem;color:var(--muted);font-weight:700}
.seg2{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg2 button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--muted);min-height:36px}
.seg2 button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);border:0;padding:0}
.dot.on{background:var(--good);color:#fff}
.dot.gym{border:1.5px dashed var(--line);background:transparent;cursor:pointer;margin-left:auto}
.dot.gym.on{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}

/* Hábitos */
.hab{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:11px}
.hab.is-met{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.hab-h{display:flex;align-items:center;gap:12px}
.hab-ic{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.hab.is-met .hab-ic{background:var(--good-soft);color:var(--good)}
.hab-t{flex:1;min-width:0}
.hab-t h3{font-size:1.02rem}
.hab-t p{font-size:.86rem;color:var(--muted)}
.tick{flex:none;width:28px;height:28px;border-radius:99px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.is-met .tick{background:var(--good);border-color:var(--good);color:#fff}
.pbar{position:relative;height:9px;border-radius:99px;background:var(--surface-2)}
.pbar i{display:block;height:100%;max-width:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.pbar.water i{background:var(--water)}
.pbar b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--ink);opacity:.45}
.bottles{display:flex;gap:10px;align-items:flex-end}
.btl{width:30px;height:auto}
.status{border-radius:10px;padding:9px 12px;font-size:.9rem;background:var(--surface-2)}
.status.ok{background:var(--good-soft);color:var(--good)}
.status.no{background:var(--bad-soft);color:var(--bad)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.story{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--accent);padding-left:12px}
.story h4{margin:0;font-family:var(--f-display);font-size:1.05rem}
.story p{font-size:.95rem}
.cat{align-self:flex-start;font-family:var(--f-mono);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* Sistemas base */
.ses{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ses-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ses-h h3{font-size:1rem}
.ses.done{opacity:.7}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;background:var(--surface-2);flex-wrap:wrap}
.files li.is-done{background:var(--good-soft)}
.fname{min-width:0;overflow-wrap:anywhere;font-size:.92rem;flex:1 1 180px}
.files li.is-done .fname{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--good) 60%,transparent)}
.preview{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.preview div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;background:var(--surface-2);font-size:.9rem}
.list{display:flex;flex-direction:column;gap:10px}

/* Historial y Shadow */
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:.78rem;color:var(--muted)}
.stat .num{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .num.txt{font-size:1.02rem;line-height:1.3}
.stat .sub{font-size:.78rem;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.bar.bond i{background:var(--bad)}
.hm-wrap{display:flex;gap:6px;overflow-x:auto}
.hm-days{display:grid;grid-template-rows:repeat(7,14px);gap:3px;font-size:.62rem;color:var(--muted);font-family:var(--f-mono)}
.hm{display:flex;gap:3px}
.hm-col{display:grid;grid-template-rows:repeat(7,14px);gap:3px}
i.hm{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--surface-2)}
i.hm.fail{background:color-mix(in srgb,var(--bad) 30%,var(--surface-2))}
i.hm.l1{background:color-mix(in srgb,var(--accent) 35%,var(--surface-2))}
i.hm.l2{background:color-mix(in srgb,var(--accent) 65%,var(--surface-2))}
i.hm.l3{background:var(--accent)}
i.hm.out{opacity:.3}
i.hm.today{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.hm-legend i.hm{width:11px;height:11px}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{text-align:center;padding:7px 4px;border-top:1px solid var(--line)}
.tbl th{font-size:.72rem;color:var(--muted);font-weight:600;border-top:0}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl .y{color:var(--good);font-weight:800}
.tbl .n{color:var(--line)}
.tbl .fail td:last-child{color:var(--bad)}
.scroll-x{overflow-x:auto}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.stages{grid-template-columns:1fr 1fr}}
.stages li{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;opacity:.6}
.stages li.reached{opacity:1;border-style:solid}
.stages li.cur{border-color:var(--accent);background:var(--accent-soft)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ach{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px}
.ach.locked{opacity:.55;border-style:dashed}
.ach b{font-family:var(--f-display)}
.ach .when{font-family:var(--f-mono);font-size:.72rem;color:var(--good)}

/* Modal y toast */
#modal{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:center;padding:20px;z-index:50}
.mbox{background:var(--surface);border-radius:16px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;max-height:90vh;overflow:auto}
.mbox .mdog{max-width:170px;margin:0 auto}
.loss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.loss b{color:var(--bad);font-family:var(--f-mono)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center}

/* ── Shadow ── */
.dog{width:100%;height:auto;display:block;overflow:visible}
.c-coat{fill:#c3884a}.c-dark{fill:#2a201a}.c-cream{fill:#ebd2a7}.c-inner{fill:#d8a07a}.c-mask{fill:#3b2c22}.c-nose{fill:#121010}.c-eye{fill:#24170c}.c-shadow{fill:#000;opacity:.12}
.dog .ln{fill:none;stroke:#8a6443;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dog .brow{fill:none;stroke:#1a1310;stroke-width:3.4;stroke-linecap:round}
.dog .hl{fill:#fff}
.dog [data-m]{display:none}
.mood-happy [data-m~="happy"],.mood-neutral [data-m~="neutral"],.mood-sad [data-m~="sad"],.mood-excited [data-m~="excited"],.mood-worried [data-m~="worried"]{display:inline}
.dog .acc{display:none}
.stage-0 .acc-ball,.stage-1 .acc-ball{display:inline}
.stage-1 .acc-band,.stage-2 .acc-band,.stage-3 .acc-band,.stage-4 .acc-band{display:inline}
.stage-2 .acc-shoes,.stage-3 .acc-shoes,.stage-4 .acc-shoes{display:inline}
.stage-3 .acc-vest,.stage-4 .acc-vest,.stage-3 .acc-bottle,.stage-4 .acc-bottle{display:inline}
.stage-4 .acc-medal,.stage-4 .acc-phones{display:inline}
.d-all{transform-origin:120px 238px}
.stage-0 .d-all{transform:scale(.7)}
.stage-1 .d-all{transform:scale(.83)}
.stage-2 .d-all{transform:scale(.94)}
.d-headwrap{transform-origin:120px 132px}
.stage-0 .d-headwrap{transform:scale(1.16)}
.stage-1 .d-headwrap{transform:scale(1.05)}
.d-tail{transform-origin:160px 210px;animation:wag 1.6s ease-in-out infinite}
.mood-happy .d-tail{animation-duration:.42s}
.mood-excited .d-tail{animation-duration:.2s}
.mood-worried .d-tail{animation:wag-small 2.4s ease-in-out infinite}
.mood-sad .d-tail{animation:none;transform:rotate(58deg)}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(15deg)}}
@keyframes wag-small{0%,100%{transform:rotate(12deg)}50%{transform:rotate(20deg)}}
.d-ear-l{transform-origin:95px 80px;transition:transform .45s}
.d-ear-r{transform-origin:145px 80px;transition:transform .45s}
.stage-0 .d-ear-l{transform:rotate(-24deg)}.stage-0 .d-ear-r{transform:rotate(24deg)}
.mood-worried .d-ear-l{transform:rotate(-17deg)}.mood-worried .d-ear-r{transform:rotate(17deg)}
.mood-sad .d-ear-l{transform:rotate(-42deg)}.mood-sad .d-ear-r{transform:rotate(42deg)}
.stage-0.mood-sad .d-ear-l{transform:rotate(-55deg)}.stage-0.mood-sad .d-ear-r{transform:rotate(55deg)}
.mood-excited .d-ear-l{transform:rotate(4deg)}.mood-excited .d-ear-r{transform:rotate(-4deg)}
.d-head{transform-origin:120px 132px;transition:transform .45s}
.mood-neutral .d-head{animation:tilt 7s ease-in-out infinite}
.mood-sad .d-head{transform:translateY(8px) rotate(-3deg)}
@keyframes tilt{0%,68%,100%{transform:rotate(0)}74%,88%{transform:rotate(-10deg)}}
.d-body{transform-origin:120px 232px;animation:breathe 3.2s ease-in-out infinite}
.mood-excited .d-body,.mood-happy .d-body{animation-duration:.9s}
@keyframes breathe{50%{transform:scaleY(1.02)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.tongue{transform-box:fill-box;transform-origin:50% 0;animation:pant .32s ease-in-out infinite alternate}
@keyframes pant{to{transform:scaleY(1.18)}}
.mood-excited .d-hop{animation:bounce .5s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-5px)}}
.fx-float{transform-box:fill-box;transform-origin:center;animation:float 2.6s ease-in infinite}
.fx-float.d2{animation-delay:1.3s}
@keyframes float{0%{transform:translateY(8px) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(-26px) scale(1);opacity:0}}
.spark{transform-box:fill-box;transform-origin:center;animation:spark .9s ease-in-out infinite alternate}
.spark.d2{animation-delay:.45s}
@keyframes spark{from{transform:scale(.4) rotate(0);opacity:.4}to{transform:scale(1.1) rotate(45deg);opacity:1}}
.tear{transform-box:fill-box;transform-origin:top;animation:drip 2.8s ease-in infinite}
@keyframes drip{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(22px);opacity:0}}
.qm{font:800 30px var(--f-display);fill:#2b5fa3;animation:qm 2.2s ease-in-out infinite}
@keyframes qm{50%{transform:translateY(-4px)}}
.hop .d-hop{animation:hop .6s ease-out}
@keyframes hop{30%{transform:translateY(-24px)}60%{transform:translateY(0)}78%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.flinch .d-hop{animation:shake .5s ease-in-out}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.spin .d-hop{animation:spin .9s ease-in-out;transform-origin:120px 238px}
@keyframes spin{0%{transform:translateY(0)}40%{transform:translateY(-30px) scaleX(-1)}80%{transform:translateY(0) scaleX(1)}}
@media (prefers-reduced-motion:reduce){.dog *,.hop .d-hop,.flinch .d-hop,.spin .d-hop{animation:none!important;transition:none!important}}

<script>
'use strict';
// ───────── Configuración ─────────
const CFG=Object.assign({supabaseUrl:'',supabaseKey:''},window.SHADOW_CONFIG||{});
const SKEY='shadow.habitos.estado.v1', LKEY='shadow.habitos.local.v1';
const HAB=['pasos','agua','chatarra','cultura','sb'];
const HAB_N={pasos:'Pasos',agua:'Agua',chatarra:'Cero chatarra',cultura:'Culturizarte',sb:'Sistemas base'};
const STAGES=[
  {lv:1,n:'Cachorro',d:'Con su pelota de tenis'},
  {lv:5,n:'Joven',d:'Banda deportiva en la frente'},
  {lv:10,n:'Adulto',d:'Tenis para correr'},
  {lv:20,n:'Corredor',d:'Chaleco reflejante y su botella'},
  {lv:30,n:'Campeón',d:'Medalla y audífonos'}
];
const RANKS=[[1,'Sedentario en recuperación'],[3,'Caminante'],[6,'Hidratado'],[10,'Disciplinado'],[15,'Imparable'],[20,'Atleta de escritorio'],[25,'Máquina'],[30,'Leyenda prime']];
const XP_MISS=50, BOND_MISS=25;
const CATS={juegos:'Videojuegos',ciencia:'Ciencia',ciber:'Ciberseguridad',tec:'Tecnología'};

// Banco de temas para culturizarse: historias cortas de lo que te gusta
const K=(id,cat,t,b,s)=>({id,cat,t,b,s});
const CULT=[
// Videojuegos
K('j01','juegos','Tetris nació en Moscú',"En 1984 Alekséi Pázhitnov, investigador de la Academia de Ciencias de la URSS, programó Tetris en una Elektronika 60, una computadora sin gráficos: las piezas eran caracteres de texto. El nombre junta «tetra» (cada pieza tiene cuatro cuadros) con tenis, su deporte favorito. Como el juego era del Estado soviético, Pázhitnov no cobró regalías hasta 1996.",'Tetris'),
K('j02','juegos','Los cartuchos enterrados de E.T.',"E.T. para Atari 2600 se programó en unas cinco semanas para alcanzar la Navidad de 1982 y terminó como sinónimo de fracaso. Por décadas se dijo que Atari había enterrado cartuchos sin vender en un basurero de Alamogordo, Nuevo México. En 2014 un equipo excavó el lugar y confirmó que la leyenda era real.",'E.T. el extraterrestre videojuego'),
K('j03','juegos','El código Konami era para hacer trampa en las pruebas',"Kazuhisa Hashimoto metió la secuencia arriba, arriba, abajo, abajo, izquierda, derecha, izquierda, derecha, B, A en el Gradius de NES (1986) porque el juego le parecía demasiado difícil para probarlo. Olvidó quitarla antes del lanzamiento. Se volvió leyenda con Contra, donde te daba 30 vidas.",'Código Konami'),
K('j04','juegos','Pac-Man y la pizza sin una rebanada',"Tōru Iwatani diseñó Pac-Man para Namco en 1980 buscando un juego de arcadia que no girara alrededor de disparar. Él mismo ha contado que la forma salió en parte de una pizza a la que le faltaba una rebanada. En Japón se llamaba Puck-Man; para Estados Unidos le cambiaron el nombre por miedo a que alguien rayara la P de las máquinas.",'Pac-Man'),
K('j05','juegos','Space Invaders aceleraba por accidente',"En Space Invaders (1978) los aliens se mueven más rápido conforme los destruyes. No era la idea original: el hardware podía dibujar más rápido mientras menos enemigos quedaban en pantalla. Tomohiro Nishikado lo dejó así porque hacía el final mucho más tenso, y esa curva de dificultad se copió durante décadas.",'Space Invaders'),
K('j06','juegos','Mario se llamaba Jumpman',"En Donkey Kong (1981) el héroe era un carpintero sin nombre fijo al que llamaban Jumpman. La historia más contada dice que en Nintendo of America lo bautizaron Mario por Mario Segale, el dueño de la bodega que rentaban. Después cambió el martillo por la llave de plomero.",'Mario personaje historia'),
K('j07','juegos','Nintendo empezó vendiendo cartas',"Fusajirō Yamauchi fundó Nintendo en Kioto en 1889 para fabricar hanafuda, unas cartas tradicionales japonesas. Antes de los videojuegos la empresa probó suerte con taxis, hoteles y arroz instantáneo. El antiguo edificio de sus oficinas en Kioto hoy funciona como hotel.",'Nintendo historia hanafuda'),
K('j08','juegos','La epidemia de World of Warcraft',"En 2005 un jefe de World of Warcraft lanzaba una maldición contagiosa llamada Corrupted Blood que debía quedarse en su mazmorra. Las mascotas de los jugadores la sacaron a las ciudades y se propagó como una epidemia real: unos huían, otros curaban y otros contagiaban a propósito. Epidemiólogos publicaron estudios usando el incidente como modelo.",'Corrupted Blood incidente'),
K('j09','juegos','Pokémon salió de coleccionar insectos',"Satoshi Tajiri de niño atrapaba insectos en las afueras de Tokio, y de ahí nació Pokémon. El cable para conectar dos Game Boy le hizo imaginar criaturas pasando de una consola a otra. Rojo y Verde tardaron unos seis años en terminarse y salieron en 1996.",'Satoshi Tajiri'),
K('j10','juegos','El primer easter egg famoso',"En 1980 Atari no ponía los nombres de sus programadores en los juegos. Warren Robinett escondió el suyo en un cuarto secreto de Adventure para Atari 2600. Cuando un jugador lo encontró, Atari decidió dejarlo y empezó a llamar «huevos de Pascua» a esas sorpresas escondidas.",'Adventure Atari 2600 Warren Robinett'),
K('j11','juegos','El ladrón del código de Half-Life 2 pidió trabajo',"En 2003 alguien se metió a la red de Valve y filtró el código fuente de Half-Life 2. Meses después el responsable, un alemán llamado Axel Gembe, escribió a Gabe Newell pidiendo empleo. Valve le siguió la corriente con una supuesta entrevista en Estados Unidos y avisó al FBI, pero fue la policía alemana la que lo detuvo.",'Half-Life 2 filtración código'),
K('j12','juegos','Pong se descompuso de tanto éxito',"Allan Alcorn programó Pong en 1972 como ejercicio de práctica en Atari. Pusieron un prototipo en el bar Andy Capp's, en California, y a los pocos días dejó de funcionar. Cuando lo abrieron, el problema era que la caja de monedas estaba llena hasta el tope.",'Pong Atari historia'),
K('j13','juegos','Los combos nacieron de un bug',"Mientras hacían Street Fighter II (1991), los desarrolladores de Capcom notaron que se podía cancelar la animación de un golpe con otro y encadenar ataques. Pensaron que era tan difícil de ejecutar que nadie lo usaría y lo dejaron. Los combos se volvieron la base de todos los juegos de pelea.",'Street Fighter II combo'),
K('j14','juegos','GTA empezó con el jugador de policía',"Grand Theft Auto empezó en DMA Design, un estudio escocés, como Race'n'Chase, un juego donde podías ser el policía. Un error hacía que la policía del juego embistiera al jugador de forma brutal y resultó más divertido escapar que perseguir. El enfoque cambió a jugar del lado criminal.",'Grand Theft Auto historia DMA Design'),
K('j15','juegos','Steam nació para mandar parches',"Valve lanzó Steam en 2003 sobre todo para actualizar Counter-Strike y sus otros juegos. Cuando Half-Life 2 lo hizo obligatorio en 2004, mucha gente lo odió. Hoy es la tienda de juegos para PC más grande del mundo.",'Steam Valve historia'),
K('j16','juegos','La primera versión de Minecraft se hizo en días',"Markus «Notch» Persson programó la primera versión de Minecraft en unos días de mayo de 2009, inspirado en Infiniminer. El juego creció a puro boca en boca, sin campaña. En 2014 Microsoft compró Mojang por 2,500 millones de dólares.",'Minecraft historia'),
K('j17','juegos','Doom corre en todo',"id Software liberó el código fuente de Doom en 1997, y desde entonces la comunidad lo ha portado a calculadoras, cámaras, cajeros, refrigeradores inteligentes y hasta a una prueba de embarazo digital (con la pantalla cambiada). «¿Corre Doom?» se volvió la prueba informal para cualquier aparato con un procesador.",'Doom 1993'),
K('j18','juegos','Sonic es azul por el logo de Sega',"Sega necesitaba una mascota que compitiera con Mario y en 1991 lanzó a Sonic, diseñado por Naoto Ohshima. Es azul porque ese era el color del logo de la empresa. Su velocidad servía para presumir lo que podía mover el procesador de la Mega Drive.",'Sonic the Hedgehog 1991'),
K('j19','juegos','Among Us tardó dos años en explotar',"Among Us salió en 2018, hecho por InnerSloth, un estudio de tres personas, y casi nadie lo jugaba. En 2020, con la pandemia y los streamers, se volvió uno de los juegos más populares del planeta de un día para otro.",'Among Us'),
K('j20','juegos','Spacewar! venía incluido con la computadora',"En 1962 un grupo de estudiantes del MIT, con Steve Russell al frente, programó Spacewar! en una PDP-1: dos naves peleando alrededor de una estrella. El fabricante DEC terminó usándolo para probar sus equipos ya instalados. Es uno de los primeros videojuegos de la historia.",'Spacewar!'),
K('j21','juegos','Zelda nació de explorar cuevas',"Shigeru Miyamoto creció en Sonobe, cerca de Kioto, explorando bosques y cuevas sin mapa. Quiso que The Legend of Zelda (1986) diera esa misma sensación de descubrir y perderse. Por eso el primer juego te suelta en el mundo casi sin explicarte nada.",'The Legend of Zelda 1986 Miyamoto'),

// Ciencia
K('c01','ciencia','La penicilina salió de un descuido',"En 1928 Alexander Fleming volvió de vacaciones y encontró una placa de bacterias contaminada con moho. Alrededor del moho las bacterias habían muerto. Ese hongo era Penicillium, y de ahí salió el primer antibiótico, que años después salvó millones de vidas.",'Penicilina descubrimiento Fleming'),
K('c02','ciencia','El microondas y la barra de chocolate',"En 1945 Percy Spencer trabajaba con magnetrones para radares en Raytheon y notó que la barra de chocolate de su bolsillo se había derretido. Probó con palomitas de maíz y funcionó. Así nació el horno de microondas; los primeros medían casi lo que un refrigerador.",'Percy Spencer microondas'),
K('c03','ciencia','Los tardígrados sobrevivieron al espacio',"Los tardígrados miden menos de un milímetro y pueden secarse casi por completo para resistir condiciones extremas. En 2007 la misión europea FOTON-M3 los expuso al vacío del espacio y varios sobrevivieron, incluso algunos a la radiación solar. Al rehidratarse, siguieron con su vida.",'Tardígrado'),
K('c04','ciencia','La Voyager 1 ya salió del sistema solar',"La Voyager 1 se lanzó en 1977 y en 2012 se convirtió en el primer objeto humano en llegar al espacio interestelar. Lleva un disco de oro con sonidos de la Tierra, música y saludos en 55 idiomas, por si alguien lo encuentra algún día.",'Voyager 1'),
K('c05','ciencia','El punto azul pálido',"En 1990, a petición de Carl Sagan, la Voyager 1 giró su cámara y fotografió la Tierra a unos 6,000 millones de kilómetros. En la foto el planeta ocupa menos de un píxel. Sagan escribió que todo lo que conocemos cabe en ese puntito.",'Pale Blue Dot'),
K('c06','ciencia','Plutón perdió su lugar en 2006',"En 2006 la Unión Astronómica Internacional definió qué es un planeta, y Plutón quedó fuera porque no ha despejado su órbita de otros objetos. Ahora es un planeta enano. La sonda New Horizons lo visitó en 2015 y descubrió un enorme glaciar en forma de corazón.",'Plutón planeta enano'),
K('c07','ciencia','El Sol que ves es de hace 8 minutos',"La luz del Sol tarda unos 8 minutos y 20 segundos en llegar a la Tierra. Si el Sol desapareciera, seguirías viéndolo ese tiempo. Con las estrellas lejanas pasa lo mismo a otra escala: algunas que ves esta noche podrían ya no existir.",'Velocidad de la luz Sol Tierra'),
K('c08','ciencia','Una sonda perdida por mezclar unidades',"En 1999 la NASA perdió la Mars Climate Orbiter porque un equipo calculó el empuje en unidades inglesas y otro esperaba unidades métricas. La sonda entró demasiado baja a la atmósfera de Marte. El error costó unos 125 millones de dólares.",'Mars Climate Orbiter'),
K('c09','ciencia','El software que salvó el alunizaje',"Minutos antes de tocar la Luna en 1969, la computadora del Apolo 11 empezó a mostrar alarmas 1202 por sobrecarga. El software, desarrollado por el equipo de Margaret Hamilton en el MIT, priorizaba las tareas importantes y descartaba las demás. Gracias a eso el aterrizaje siguió adelante.",'Margaret Hamilton Apolo 11'),
K('c10','ciencia','El velcro lo inventó un perro (casi)',"En 1941 el ingeniero suizo George de Mestral volvió de cazar con su perro y los dos estaban llenos de abrojos. Los vio al microscopio, notó sus diminutos ganchos y copió la idea. Patentó el velcro en los años cincuenta.",'Velcro George de Mestral'),
K('c11','ciencia','Los pulpos tienen tres corazones',"Un pulpo tiene tres corazones: dos bombean sangre a las branquias y uno al resto del cuerpo. Su sangre es azul porque usa hemocianina, una molécula con cobre, en lugar de hemoglobina con hierro. Además buena parte de sus neuronas está en los brazos.",'Pulpo anatomía'),
K('c12','ciencia','Los plátanos son un poco radiactivos',"Los plátanos tienen potasio, y una fracción natural del potasio es el isótopo radiactivo potasio-40. La dosis es ridículamente baja y no hace ningún daño. Tu propio cuerpo también tiene potasio-40.",'Potasio-40'),
K('c13','ciencia','El asteroide de los dinosaurios cayó en Yucatán',"Hace unos 66 millones de años un asteroide golpeó lo que hoy es la península de Yucatán y dejó el cráter de Chicxulub, de unos 180 kilómetros. El impacto está ligado a la extinción de los dinosaurios no avianos. El cráter está enterrado, pero se nota en los cenotes que forman un arco.",'Cráter de Chicxulub'),
K('c14','ciencia','La nariz de un perro',"Un perro tiene cientos de millones de receptores olfativos, contra unos seis millones de una persona. Además, la parte de su cerebro dedicada al olfato es proporcionalmente muchísimo más grande. Por eso los pastores alemanes son tan usados para detectar explosivos, drogas y personas.",'Olfato del perro'),
K('c15','ciencia','La miel casi no se echa a perder',"La miel tiene muy poca agua, es ácida y produce pequeñas cantidades de peróxido de hidrógeno. Las bacterias casi no pueden crecer en ella. Si se cristaliza no está echada a perder: basta con calentarla un poco.",'Miel conservación'),
K('c16','ciencia','La primera radiografía fue la mano de su esposa',"En 1895 Wilhelm Röntgen descubrió por accidente unos rayos que atravesaban materiales y los llamó X porque no sabía qué eran. Una de sus primeras imágenes fue la mano de su esposa, Anna Bertha, con su anillo. Fue el primer Nobel de Física, en 1901.",'Wilhelm Röntgen rayos X'),
K('c17','ciencia','El teflón salió de un experimento fallido',"En 1938 Roy Plunkett, químico de DuPont, buscaba un nuevo refrigerante. Al abrir un cilindro que parecía vacío encontró un polvo blanco resbaladizo: politetrafluoroetileno. Primero se usó en proyectos militares y después en sartenes.",'Teflón Roy Plunkett'),
K('c18','ciencia','Tu cerebro gasta una quinta parte de tu energía',"El cerebro pesa alrededor del 2% del cuerpo, pero consume cerca del 20% de la energía en reposo. Estudiar de verdad cansa por algo. Dormir le sirve, entre otras cosas, para limpiar desechos que se acumulan durante el día.",'Cerebro consumo de energía'),
K('c19','ciencia','16 amaneceres al día',"La Estación Espacial Internacional da una vuelta a la Tierra cada 90 minutos aproximadamente, a unos 28,000 km/h. Sus tripulantes ven unos 16 amaneceres y 16 atardeceres al día, así que se guían por un horario fijo para dormir.",'Estación Espacial Internacional'),
K('c20','ciencia','La primera foto de un agujero negro',"En 2019 el Event Horizon Telescope publicó la primera imagen de un agujero negro, en la galaxia M87. Para lograrlo combinaron radiotelescopios de todo el mundo como si fueran uno del tamaño del planeta. Los datos eran tantos que se transportaron en discos duros por avión.",'Event Horizon Telescope M87'),
K('c21','ciencia','La Luna se aleja cada año',"La Luna se aleja de la Tierra unos 3.8 centímetros por año. Se mide disparando láseres a espejos que dejaron las misiones Apolo y cronometrando cuánto tarda en volver la luz.",'Experimento de alcance láser lunar'),

// Ciberseguridad
K('s01','ciber','El gusano Morris y un error de cálculo',"En 1988 Robert Tappan Morris, estudiante de Cornell, soltó un gusano para medir el tamaño de internet. Un fallo en su lógica hacía que reinfectara la misma máquina una y otra vez, y miles de computadoras se volvieron inutilizables. Fue el primer condenado bajo la ley federal de fraude informático de EE. UU., y el incidente llevó a crear el CERT. Hoy es profesor del MIT.",'Gusano Morris'),
K('s02','ciber','Stuxnet, el malware que rompía centrífugas',"Stuxnet se descubrió en 2010 y estaba diseñado para sabotear las centrífugas de enriquecimiento de uranio de Natanz, en Irán, manipulando controladores Siemens. Usaba cuatro vulnerabilidades zero-day y entró a una red aislada probablemente por USB. Se considera la primera ciberarma que causó daño físico.",'Stuxnet'),
K('s03','ciber','El kill switch de WannaCry costó unos 10 dólares',"En mayo de 2017, mientras WannaCry se extendía por el mundo, el investigador Marcus Hutchins notó que el malware consultaba un dominio raro que no existía. Lo registró por unos 10 dólares para rastrear infecciones y resultó que, al existir, el ransomware dejaba de cifrar. Así frenó la primera ola casi por accidente.",'WannaCry Marcus Hutchins'),
K('s04','ciber','El huevo del cuco: 75 centavos de diferencia',"En 1986 Clifford Stoll, astrónomo que administraba sistemas en el laboratorio Lawrence Berkeley, encontró una diferencia de 75 centavos en la contabilidad de tiempo de cómputo. Tirando de ese hilo descubrió a un intruso alemán que vendía información a la KGB. Para atraparlo inventó documentos falsos como señuelo, una especie de honeypot temprano. Es una gran historia de threat hunting.",'Clifford Stoll The Cuckoo\'s Egg'),
K('s05','ciber','Heartbleed: pedir más de lo que mandas',"En 2014 se descubrió Heartbleed en OpenSSL. El servidor respondía a un mensaje de latido devolviendo la longitud que el cliente decía haber mandado, sin verificarla. Pidiendo de más, un atacante leía hasta 64 KB de memoria por petición: llaves privadas, contraseñas, cookies.",'Heartbleed'),
K('s06','ciber','Log4Shell empezó en servidores de Minecraft',"En diciembre de 2021 apareció Log4Shell (CVE-2021-44228), una falla en la librería Log4j de Java que permitía ejecutar código con solo hacer que el servidor registrara un texto especial. Entre los primeros exploits públicos estaban los de servidores de Minecraft, donde bastaba escribirlo en el chat. Obtuvo la calificación máxima, 10.",'Log4Shell'),
K('s07','ciber','El primer «bug» era una polilla de verdad',"En 1947 el equipo de la computadora Harvard Mark II encontró una polilla atorada en un relé y la pegó en la bitácora con una nota. Grace Hopper popularizó la anécdota. La palabra «bug» ya se usaba para fallas técnicas, pero esa fue la primera vez que fue literal.",'Grace Hopper bug polilla'),
K('s08','ciber','Enigma la rompieron primero los polacos',"Antes de Alan Turing, el matemático polaco Marian Rejewski logró descifrar Enigma en 1932. En 1939, poco antes de la invasión alemana, Polonia compartió su trabajo con británicos y franceses. En Bletchley Park, Turing y su equipo construyeron las máquinas bombe a partir de esas ideas.",'Marian Rejewski Enigma'),
K('s09','ciber','ILOVEYOU y la extensión escondida',"En mayo de 2000 millones de personas abrieron un correo con un adjunto llamado LOVE-LETTER-FOR-YOU.TXT.vbs. Windows ocultaba la extensión real, así que parecía un texto inofensivo. El autor, en Filipinas, no pudo ser castigado porque no había ley contra eso; el país aprobó una poco después.",'ILOVEYOU gusano'),
K('s10','ciber','El silbato del cereal que hackeaba teléfonos',"Un silbato de juguete regalado en cajas de cereal Cap'n Crunch producía un tono de 2600 Hz, justo el que usaba la red telefónica de AT&T para controlar las líneas. Con él se podían hacer llamadas de larga distancia gratis. John Draper se volvió famoso como «Captain Crunch», y Steve Jobs y Steve Wozniak llegaron a vender cajas azules para lo mismo.",'John Draper phreaking'),
K('s11','ciber','Creeper, el primer programa que saltaba de máquina en máquina',"En 1971 Bob Thomas, de BBN, escribió Creeper, un programa experimental que se movía entre computadoras de ARPANET mostrando un mensaje burlón para que lo atraparan. Poco después apareció Reaper, creado para perseguirlo y borrarlo: el abuelo de los antivirus.",'Creeper programa'),
K('s12','ciber','Equifax: un parche pendiente y un certificado vencido',"En 2017 atacantes entraron a Equifax por una vulnerabilidad de Apache Struts que ya tenía parche desde hacía meses. Se llevaron datos de unos 147 millones de personas. Un certificado vencido en una herramienta de inspección de tráfico hizo que la exfiltración pasara sin ser vista durante mucho tiempo.",'Filtración de Equifax 2017'),
K('s13','ciber','SolarWinds: el ataque venía en la actualización',"En 2020 se descubrió que atacantes habían metido una puerta trasera en las actualizaciones legítimas de SolarWinds Orion. Unas 18,000 organizaciones la instalaron. Lo detectó FireEye mientras investigaba el robo de sus propias herramientas de red team.",'Ataque a SolarWinds'),
K('s14','ciber','NotPetya y el servidor salvado por un apagón',"En 2017 NotPetya se propagó a través de una actualización de M.E.Doc, un software de contabilidad ucraniano, y destruyó redes enteras. La naviera Maersk tuvo que reinstalar decenas de miles de equipos. Su directorio activo sobrevivió gracias a un controlador de dominio en Ghana que estaba desconectado por un apagón.",'NotPetya Maersk'),

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pad=n=>String(n).padStart(2,'0');
const nowD=()=>new Date(window.__NOW||Date.now());
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ds(nowD());
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return ds(new Date(y,m-1,d+n))}
function diffDays(a,b){const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5)}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const dateOf=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtShort=s=>{const d=dateOf(s);return `${d.getDate()} ${MESC[d.getMonth()]}`};
const fmtLong=s=>{const d=dateOf(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MESC[d.getMonth()]}`};
const fmtN=n=>Number(n||0).toLocaleString('es-MX');
const fmtL=w=>(Math.round(w*10)/10).toLocaleString('es-MX')+' L';
const dias=n=>n===1?'día':'días';
function h32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?u:'';

// ───────── Estado ─────────
function freshState(){return{v:1,createdAt:today(),settings:{u:0,name:'Yorsh',stepGoal:8000,stepBonus:10000,waterGoal:2},days:{},sessions:{}}}
function freshLocal(){return{sound:true,lossShown:null}}
function normalize(o){
  const f=freshState();if(!o||typeof o!=='object')return f;
  return{v:1,createdAt:/^\d{4}-\d{2}-\d{2}$/.test(o.createdAt||'')?o.createdAt:f.createdAt,
    settings:Object.assign({},f.settings,o.settings||{}),
    days:o.days&&typeof o.days==='object'?o.days:{},
    sessions:o.sessions&&typeof o.sessions==='object'?o.sessions:{}};
}
let S,L,STORAGE_OK=true;
function load(){
  try{S=normalize(JSON.parse(localStorage.getItem(SKEY)||'null'))}catch(e){STORAGE_OK=false;S=freshState()}
  try{L=Object.assign(freshLocal(),JSON.parse(localStorage.getItem(LKEY)||'null')||{})}catch(e){L=freshLocal()}
}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));localStorage.setItem(LKEY,JSON.stringify(L))}catch(e){STORAGE_OK=false}}
const getDay=d=>S.days[d]||{};
function setF(d,k,v){const day=S.days[d]||(S.days[d]={});day[k]=v;(day.uf||(day.uf={}))[k]=Date.now()}

// Mezcla de dos copias (compu y teléfono): gana el cambio más reciente de cada campo
function mergeDay(x,y){
  if(!x)return y;if(!y)return x;
  const out={uf:{}};const ux=x.uf||{},uy=y.uf||{};
  for(const k of new Set([...Object.keys(ux),...Object.keys(uy)])){const a=ux[k]||0,b=uy[k]||0;out[k]=b>a?y[k]:x[k];out.uf[k]=Math.max(a,b)}
  return out;
}
function mergeSes(x,y){
  if(!x)return y;if(!y)return x;
  const out=Object.assign({},(y.u||0)>(x.u||0)?y:x);
  const n=Math.max(x.files.length,y.files.length);out.files=[];
  for(let i=0;i<n;i++){const a=x.files[i],b=y.files[i];out.files.push(!a?b:!b?a:((b.u||0)>(a.u||0)?b:a))}
  return out;
}
function merge(a,b){
  a=normalize(a);b=normalize(b);
  const out={v:1,createdAt:a.createdAt<b.createdAt?a.createdAt:b.createdAt,settings:(b.settings.u||0)>(a.settings.u||0)?b.settings:a.settings,days:{},sessions:{}};
  for(const k of new Set([...Object.keys(a.days),...Object.keys(b.days)]))out.days[k]=mergeDay(a.days[k],b.days[k]);
  for(const k of new Set([...Object.keys(a.sessions),...Object.keys(b.sessions)]))out.sessions[k]=mergeSes(a.sessions[k],b.sessions[k]);
  return out;
}

// ───────── Motor: todo se calcula a partir de lo registrado ─────────
function costOf(n){return 100+25*(n-1)}
function levelInfo(xp){let lvl=1,base=0;while(xp>=base+costOf(lvl)){base+=costOf(lvl);lvl++}return{lvl,base,need:costOf(lvl),into:xp-base}}
function stageOf(lvl){let s=0;STAGES.forEach((st,i)=>{if(lvl>=st.lv)s=i});return s}
function rankOf(lvl){let r=RANKS[0][1];for(const [l,n] of RANKS)if(lvl>=l)r=n;return r}
function sessionList(st=S){return Object.values(st.sessions).filter(s=>!s.del).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.title).localeCompare(String(b.title)))}
function flatFiles(st){
  const out=[];
  for(const s of Object.values(st.sessions)){if(s.del)continue;const sd=s.added&&s.added>s.date?s.added:s.date;s.files.forEach(f=>out.push({sd,done:f.done||null}))}
  return out;
}
function dayInfo(st,d,files){
  const g=st.settings,day=st.days[d]||{},prev=st.days[addDays(d,-1)]||{};
  const steps=+day.steps||0,water=+day.water||0,junk=+day.junk||0,pj=+prev.junk||0;
  let anot=0,pending=0;
  for(const f of files){
    if(f.done===d)anot++;
    if(f.sd<=d&&f.done!=='pre'&&!(f.done&&f.done<=d))pending++;
  }
  const met={pasos:steps>=g.stepGoal,agua:water>=g.waterGoal-1e-9,chatarra:junk+pj<=1,cultura:!!day.culture,sb:anot>0||pending===0};
  return{d,met,count:HAB.filter(k=>met[k]).length,steps,water,junk,pj,anot,pending,gym:!!day.gym,culture:!!day.culture,tenK:steps>=g.stepBonus};
}
function compute(st,t){
  const R={xp:0,vinc:60,streak:0,best:0,lost:null,days:{},ach:{},tot:{prime:0,tenK:0,read:0,anot:0,gym:0},runs:{agua:0,limpio:0}};
  if(!st.createdAt||st.createdAt>t)return R;
  const files=flatFiles(st),totalFiles=files.length;
  for(let d=st.createdAt;d<=t;d=addDays(d,1)){
    const I=dayInfo(st,d,files);R.days[d]=I;
    const closed=d<t,first=d===st.createdAt;
    let gain=20*I.count+(I.count===5?40:0)+(I.tenK?15:0)+(I.gym?25:0)+10*Math.max(0,I.anot-1);
    if(I.count>=3){R.streak++;R.best=Math.max(R.best,R.streak);gain+=5*Math.min(R.streak,10);R.vinc=Math.min(100,R.vinc+(I.count===5?15:10))}
    R.xp+=gain;I.gain=gain;
    if(I.count<3&&closed&&!first){
      if(R.streak>0)R.lost={value:R.streak,date:d};
      R.streak=0;
      const base=levelInfo(R.xp).base,xl=Math.min(XP_MISS,R.xp-base);R.xp-=xl;
      const vl=Math.min(BOND_MISS,R.vinc);R.vinc-=vl;
      I.failed=true;I.xpLoss=xl;I.vLoss=vl;
    }
    if(I.count===5)R.tot.prime++;if(I.tenK)R.tot.tenK++;if(I.culture)R.tot.read++;R.tot.anot+=I.anot;if(I.gym)R.tot.gym++;
    R.runs.agua=I.met.agua?R.runs.agua+1:(closed?0:R.runs.agua);
    if(closed)R.runs.limpio=I.junk===0?R.runs.limpio+1:0;
    const lvl=levelInfo(R.xp).lvl;
    for(const [id,,,test] of ACH)if(!R.ach[id]&&test(R,I,lvl,totalFiles))R.ach[id]=d;
  }
  return R;
}

function nameFromUrl(u){try{const p=new URL(u).pathname.split('/').filter(Boolean).pop()||u;return decodeURIComponent(p)}catch(e){return u}}
function parseTeams(text,fallback,ref){
  const refY=+ref.slice(0,4),refM=+ref.slice(5,7);
  const out=[];let cur=null;
  const mk=(date,title)=>{cur={date,title,desc:[],files:[]};out.push(cur);return cur};
  const target=()=>cur||mk(fallback,'Sesión '+fmtShort(fallback));
  for(const raw of String(text).split(/\r?\n/)){
    let line=raw.replace(/^[\s*•·\-]+/,'').trim();
    if(!line)continue;
    const h=line.match(/^Sesi[oó]n\s+(?:del?\s+)?(\d{1,2})\s+(?:de\s+)?([A-Za-zÁÉÍÓÚáéíóú]{3,})/i);
    if(h){const m=MESES[norm(h[2]).slice(0,3)],dd=+h[1];if(m&&dd>=1&&dd<=31){const y=m>refM+1?refY-1:refY;mk(`${y}-${pad(m)}-${pad(dd)}`,`Sesión ${dd} ${MESC[m-1]}`);continue}}
    if(/\d{1,2}\/\d{1,2}\s+\d{1,2}:\d{2}/.test(line))continue;
    line=line.replace(/^ver m[aá]s/i,'').replace(/Responder$/i,'').trim();
    if(!line||/^(responder|editado)$/i.test(line))continue;
    const links=[...line.matchAll(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g)];
    if(links.length){links.forEach(m=>target().files.push({name:m[1].trim(),url:m[2]}));continue}
    const urls=line.match(/https?:\/\/[^\s)<>"]+/g);
    if(urls){urls.forEach(u=>target().files.push({name:nameFromUrl(u),url:u}));continue}
    const docs=[...line.matchAll(/(.+?\.(?:pdf|docx?|pptx?|xlsx?|zip))(?=$|personal|\s*$)/gi)];
    if(docs.length){docs.forEach(m=>{let n=m[1];if(/personal\s*>/i.test(n))n=n.replace(/^.*?personal\s*>\s*[\w.-]*?(?:_mx|_com|_org|_net)(?=[A-Z0-9])/,'').replace(/^.*?personal\s*>\s*\S*?_(?:mx|com|org|net)/i,'');n=n.trim();if(n)target().files.push({name:n,url:''})});continue}
    if(cur&&!cur.files.length)cur.desc.push(line);
  }
  return out.filter(s=>s.files.length).map(s=>{
    const withUrl=s.files.find(f=>f.url),um=withUrl&&withUrl.url.match(/Unidad(?:%20|\s|_|\+)+(\d+)/i);
    return{id:'s'+s.date.replace(/-/g,'')+'-'+h32(s.files.map(f=>f.name).join('|')).toString(36),date:s.date,title:s.title,desc:s.desc.join(' ').slice(0,500),unit:um?+um[1]:null,files:s.files};
  });
}
function addSessions(list){
  let n=0;const t=today(),now=Date.now();
  for(const p of list){
    const ex=S.sessions[p.id];
    if(ex&&!ex.del)continue;

  }

}

function readIds(){const s=new Set();for(const d of Object.values(S.days))if(d.culture&&d.cultureId)s.add(d.cultureId);return s}
function cultureFor(day){
  const d=getDay(day);
  if(d.cultureId){const it=CULT.find(x=>x.id===d.cultureId);if(it)return it}
  const read=readIds();let pool=CULT.filter(x=>!read.has(x.id));if(!pool.length)pool=CULT;
  return pool[h32(day)%pool.length];
}
function otherCulture(day){
  const cur=cultureFor(day),read=readIds();
  let pool=CULT.filter(x=>!read.has(x.id)&&x.id!==cur.id);if(!pool.length)pool=CULT.filter(x=>x.id!==cur.id);
  setF(day,'cultureId',pick(pool).id);
}

let R=null,V='hoy',Sel=null,CurLine='';
function recompute(){R=compute(S,today())}
function moodNow(){
  const t=today(),I=R.days[t];if(!I)return'neutral';
  if(I.count>=5)return'excited';if(I.count===4)return'happy';if(I.count===3)return'neutral';
  const y=R.days[addDays(t,-1)];
  if((y&&y.failed)||R.vinc<25)return'sad';
  if(nowD().getHours()>=20)return'worried';
  return'neutral';
}
function fmtLine(s){
  const I=R.days[Sel||today()]||{count:0};
  return s.replace(/\{n\}/g,S.settings.name).replace(/\{c\}/g,I.count).replace(/\{f\}/g,Math.max(0,3-I.count)).replace(/\{s\}/g,R.streak).replace(/\{d\}/g,dias(R.streak)).replace(/\{l\}/g,R.lost?R.lost.value:0);
}
function homeLine(){
  const t=today(),I=R.days[t]||{count:0},y=R.days[addDays(t,-1)];
  if(t===S.createdAt&&I.count===0&&!Object.keys(S.days).length)return fmtLine(LINES.intro[0]);
  const m=moodNow();
  if(m==='excited')return fmtLine(pick(LINES.five));
  if(m==='happy')return fmtLine(pick(LINES.four));
  if(I.count===3)return fmtLine(pick(LINES.three));
  if(m==='sad'){
    if(!(y&&y.failed))return fmtLine(pick(LINES.sadLow));
    const lostY=R.lost&&R.lost.date===y.d;
    return fmtLine(pick(lostY?LINES.sad:LINES.sad.filter(s=>!s.includes('{l}'))));
  }
  if(m==='worried')return fmtLine(pick(R.streak>0?LINES.worried:LINES.worried.filter(s=>!s.includes('{s}'))));
  if(I.pj>0&&I.junk===0&&Math.random()<.5)return fmtLine(LINES.junkDay[0]);
  return fmtLine(pick(LINES.morning));
}

// ───────── Sonidos (sintetizados, sin archivos) ─────────
let AC=null;
function actx(){if(!L.sound)return null;try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function env(g,t,peak,att,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec)}
function noiseBuf(a,dur){const b=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*dur)),a.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function tone(f,start,dur,type='sine',vol=.15){const a=actx();if(!a)return;const t=a.currentTime+start;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;env(g,t,vol,.01,dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
const SFX={
  ding(){tone(880,0,.3,'triangle',.16);tone(1320,.09,.35,'triangle',.14)},
  chime(){[1047,1319,1568].forEach((f,i)=>tone(f,i*.08,.4,'sine',.12))},
  levelup(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.35,'triangle',.15))},
  glug(){tone(420,0,.12,'sine',.14);tone(560,.1,.14,'sine',.12)},
  bark(n=2,p=1){const a=actx();if(!a)return;for(let k=0;k<n;k++){const t=a.currentTime+k*.21;
    const o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(560*p,t);o.frequency.exponentialRampToValueAtTime(230*p,t+.12);
    const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1000*p;f.Q.value=1.4;const g=a.createGain();env(g,t,.55,.012,.15);
    o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+.2);
    const ns=a.createBufferSource();ns.buffer=noiseBuf(a,.1);const nf=a.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1800*p;const ng=a.createGain();env(ng,t,.22,.005,.07);
    ns.connect(nf).connect(ng).connect(a.destination);ns.start(t)}},
  whine(dur=1.3){const a=actx();if(!a)return;const t=a.currentTime;const o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(900,t);o.frequency.linearRampToValueAtTime(1250,t+dur*.35);o.frequency.linearRampToValueAtTime(620,t+dur);
    const lfo=a.createOscillator();lfo.frequency.value=7;const lg=a.createGain();lg.gain.value=30;lfo.connect(lg).connect(o.frequency);
    const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.08);g.gain.setValueAtTime(.15,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(a.destination);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05)},
  whimper(){SFX.whine(.5)}
};

// ───────── Sincronización (Supabase) ─────────
let SB=null,USER=null;
const SYNC={state:CFG.supabaseUrl&&CFG.supabaseKey?'busy':'local',msg:'',at:0};
const SYNC_TXT={local:'Solo en este dispositivo',login:'Falta iniciar sesión',busy:'Sincronizando…',ok:'Sincronizado',err:'Error de sincronización'};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+src));document.head.appendChild(s)})}
async function initSync(){
  if(SYNC.state==='local')return;
  try{
    if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
    SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'shadow.habitos.auth'}});
    const {data}=await SB.auth.getSession();USER=data.session?data.session.user:null;
    SB.auth.onAuthStateChange((ev,sess)=>{const was=USER;USER=sess?sess.user:null;if(USER&&!was)pull();if(!USER){SYNC.state='login';render()}});
    if(USER)await pull();else{SYNC.state='login';render()}
  }catch(e){SYNC.state='err';SYNC.msg=e.message||String(e);render()}
}
async function pull(){
  if(!SB||!USER)return;
  SYNC.state='busy';renderHeader();
  try{
    const {data,error}=await SB.from('habitos').select('data').eq('user_id',USER.id).maybeSingle();
    if(error)throw error;
    const before=JSON.stringify(S);
    if(data&&data.data)S=merge(S,data.data);
    save();
    if(!data||JSON.stringify(S)!==JSON.stringify(normalize(data.data)))await upsert();
    SYNC.state='ok';SYNC.at=Date.now();SYNC.msg='';
    if(JSON.stringify(S)!==before){CurLine=homeLine();render();checkAbsence()}else renderHeader();
  }catch(e){SYNC.state='err';SYNC.msg=e.message||String(e);render()}
}
async function upsert(){
  const {error}=await SB.from('habitos').upsert({user_id:USER.id,data:S,updated_at:new Date().toISOString()});
  if(error)throw error;
}
let pushT=null;
function schedulePush(){if(!SB||!USER)return;clearTimeout(pushT);pushT=setTimeout(push,1200)}
async function push(){
  if(!SB||!USER)return;
  SYNC.state='busy';renderHeader();
  try{
    const {data,error}=await SB.from('habitos').select('data').eq('user_id',USER.id).maybeSingle();
    if(error)throw error;
    const before=JSON.stringify(S);
    if(data&&data.data)S=merge(S,data.data);
    save();await upsert();
    SYNC.state='ok';SYNC.at=Date.now();SYNC.msg='';
    if(JSON.stringify(S)!==before)render();else renderHeader();
  }catch(e){SYNC.state='err';SYNC.msg=e.message||String(e);renderHeader()}
}
async function login(email,pass){
  if(!SB)return;
  const {error}=await SB.auth.signInWithPassword({email,password:pass});
  if(error){SYNC.msg=error.message==='Invalid login credentials'?'Correo o contraseña incorrectos.':error.message;render();return}
  toast('Sesión iniciada');
}

function animDog(cls){const w=$('#dogwrap');if(!w)return;w.classList.remove('hop','flinch','spin');void w.offsetWidth;w.classList.add(cls);setTimeout(()=>w.classList.remove(cls),950)}
function commit(line){
  const before=R;save();schedulePush();recompute();
  const b=before.days[Sel]||{count:0},a=R.days[Sel]||{count:0};
  const lb=levelInfo(before.xp).lvl,la=levelInfo(R.xp).lvl;
  let anim=null;
  if(a.count>b.count){
    if(a.count===5){SFX.levelup();setTimeout(()=>SFX.bark(3,1.2),550);anim='spin';line=pick(LINES.five)}
    else if(a.count===4){SFX.bark(2,1.25);anim='hop';line=pick(LINES.four)}
    else if(a.count===3){SFX.bark(2,1.15);anim='hop';line=pick(LINES.three)}
    else{SFX.ding();anim='hop'}
  }else if(a.count<b.count){SFX.whimper();anim='flinch'}
  if(la>lb){const sa=stageOf(la),sb=stageOf(lb);setTimeout(()=>SFX.levelup(),300);toast(sa>sb?`Shadow creció: ahora es ${STAGES[sa].n}. ${STAGES[sa].d}.`:`Subiste a nivel ${la}: ${rankOf(la)}`)}
  const newAch=Object.keys(R.ach).filter(k=>!before.ach[k]);
  if(newAch.length){setTimeout(()=>SFX.chime(),700);setTimeout(()=>toast('Logro: '+ACH.find(x=>x[0]===newAch[0])[1]),la>lb?2700:0)}
  CurLine=line?fmtLine(line):homeLine();
  render();if(anim)animDog(anim);
}

  const g=S.settings;
  let sync;
  if(SYNC.state==='local')sync=`<p class="note">Modo local: los datos viven solo en este navegador. Para sincronizar iPhone y compu, llena <b class="mono">config.js</b> con los datos de Supabase (los pasos están en LEEME.md).</p>`;
  else if(!USER&&SB)sync=`<form data-form="login" style="display:flex;flex-direction:column;gap:10px"><p class="note">Entra con el usuario que creaste en Supabase. En el iPhone hazlo dentro de la app ya instalada en la pantalla de inicio, no en Safari.</p>
    <label class="field">Correo<input id="lg-email" class="inp" type="email" autocomplete="username" required></label>
    <label class="field">Contraseña<input id="lg-pass" class="inp" type="password" autocomplete="current-password" required></label>
    ${SYNC.msg?`<p class="err">${esc(SYNC.msg)}</p>`:''}<div class="btnrow"><button class="btn primary">Entrar</button></div></form>`;
  else if(SYNC.state==='err'&&!SB)sync=`<p class="err">${esc(SYNC.msg)}</p><p class="note">Revisa tu conexión y vuelve a abrir la app.</p>`;
  else sync=`<p class="note">${USER?`Conectado como <b>${esc(USER.email||'')}</b>. `:''}${SYNC_TXT[SYNC.state]}${SYNC.at?' · '+new Date(SYNC.at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):''}</p>${SYNC.state==='err'?`<p class="err">${esc(SYNC.msg)}</p>`:''}
    <div class="btnrow" style="margin-top:10px"><button class="btn sm" data-act="sync-now">Sincronizar ahora</button><button class="btn ghost sm" data-act="logout">Cerrar sesión</button></div>`;
  return`<section class="card"><div class="card-h"><h2>Sincronización</h2><span class="syncdot ${SYNC.state}"></span></div>${sync}</section>
  <section class="card"><div class="card-h"><h2>Metas</h2></div>
    <form data-form="goals" style="display:flex;flex-direction:column;gap:10px">
    <div class="grid2"><label class="field">Tu nombre<input id="g-name" class="inp" value="${esc(g.name)}"></label><label class="field">Agua al día (litros)<input id="g-water" class="inp" type="number" min="0.5" max="6" step="0.5" value="${g.waterGoal}"></label>
    <label class="field">Pasos para cumplir<input id="g-steps" class="inp" type="number" min="1000" step="500" value="${g.stepGoal}"></label><label class="field">Pasos para el bonus<input id="g-bonus" class="inp" type="number" min="1000" step="500" value="${g.stepBonus}"></label></div>
    <p class="note">Ojo: cambiar una meta también recalcula los días pasados.</p>
    <div class="btnrow"><button class="btn primary">Guardar metas</button></div></form></section>
  <section class="card"><div class="card-h"><h2>Avisos</h2></div>
    <p class="note">Los avisos los manda tu iPhone con la app Atajos: Automatización → Hora del día → Diariamente → Ejecutar inmediatamente → acción «Mostrar notificación». Crea una por cada hora que quieras. Los pasos completos están en LEEME.md. Ideas de mensajes:</p>
    <ul class="sm" style="margin:8px 0 0;padding-left:18px"><li>Shadow: ¿ya tomaste agua?</li><li>Shadow: NO comas porquería. Te estoy viendo.</li><li>Shadow: ¿y lo de sistemas base?</li><li>Shadow: anota tus pasos antes de dormir.</li></ul></section>
  <section class="card"><div class="card-h"><h2>Respaldo</h2></div>
    <div class="btnrow"><button class="btn sm" data-act="export">Exportar respaldo</button><button class="btn sm" data-act="import">Importar respaldo</button><button class="btn sm ghost ${SBUI.reset?'danger':''}" data-act="reset">Reiniciar todo</button></div>
    ${SBUI.reset?`<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px"><p class="sm">Esto borra todo en este dispositivo${USER?' y en la nube':''}. Escribe <b class="mono">SHADOW</b> para confirmar.</p><div class="inl"><input id="resetin" class="inp" autocomplete="off"><button class="btn danger sm" data-act="reset-go">Borrar</button><button class="btn ghost sm" data-act="reset-no">Cancelar</button></div></div>`:''}
    <p class="note" style="margin-top:10px">Importar un respaldo lo mezcla con lo que ya tienes, no lo reemplaza.</p></section>
  <section class="card"><div class="card-h"><h2>Sonido</h2></div><div class="btnrow"><button class="btn sm" data-act="sound">${L.sound?'Silenciar a Shadow':'Activar sonido'}</button></div></section>`;
}
};

// ───────── Ausencias ─────────
function checkAbsence(){
  if(!$('#modal').hidden)return;
  const t=today(),y=addDays(t,-1),I=R.days[y];
  if(!I||!I.failed||L.lossShown===y)return;
  let n=0,xl=0,vl=0,d=y;
  while(R.days[d]&&R.days[d].failed){n++;xl+=R.days[d].xpLoss||0;vl+=R.days[d].vLoss||0;d=addDays(d,-1)}
  const lost=R.lost&&diffDays(R.lost.date,y)>=0&&diffDays(R.lost.date,y)<n?R.lost.value:0;
  const st=stageOf(levelInfo(R.xp).lvl);
  $('#modal').innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="abs-t"><div class="mdog">${dogSVG()}</div>
  <h2 id="abs-t">${n===1?`Ayer cumpliste ${I.count} de 5`:`Shadow te esperó ${n} días`}</h2>
  <ul class="loss">${lost?`<li>Racha perdida: <b>${lost} ${dias(lost)}</b></li>`:''}<li>Vínculo: <b>−${vl}</b></li>${xl?`<li>XP: <b>−${xl}</b></li>`:''}</ul>
  <p class="muted">¿Se te olvidó registrar algo de ayer, como los pasos? Todavía puedes hacerlo y Shadow lo recalcula.</p>
  <div class="btnrow" style="justify-content:center"><button class="btn primary" data-act="abs-fix">Registrar lo de ayer</button><button class="btn" data-act="abs-ok">Perdón, Shadow</button></div></div>`;
  $('#modal .dog').setAttribute('class',`dog mood-sad stage-${st}`);
  $('#modal').hidden=false;
}
function closeAbsence(fix){L.lossShown=addDays(today(),-1);save();$('#modal').hidden=true;if(fix){Sel=addDays(today(),-1);V='hoy'}else SFX.whine();CurLine=homeLine();render()}

// ───────── Respaldo ─────────
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`shadow-habitos-respaldo-${today()}.json`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('Respaldo descargado');
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!o.days||!o.sessions)throw 0;S=merge(S,o);commit();toast('Respaldo importado')}catch(e){toast('Ese archivo no es un respaldo de Shadow Hábitos.')}};
  r.readAsText(file);
}

// ───────── Eventos ─────────
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act!=='ses-del')SBUI.delArm=null;
  switch(act){
    case'nav':SBUI.reset=false;go(b.dataset.v);break;
    case'sel':Sel=b.dataset.d;CurLine=homeLine();render();break;
    case'sound':L.sound=!L.sound;save();render();if(L.sound)SFX.bark(1,1.3);break;
    case'water':{const v=+b.dataset.v,cur=+getDay(Sel).water||0,nv=Math.max(0,Math.min(10,Math.round((cur+v)*2)/2));setF(Sel,'water',nv);if(v>0)SFX.glug();commit(v>0?pick(LINES.water):null);break}
    case'junk':{const v=+b.dataset.v,cur=+getDay(Sel).junk||0;setF(Sel,'junk',Math.max(0,cur+v));commit(v>0?pick(LINES.junk):null);break}
    case'cult-read':setF(Sel,'cultureId',b.dataset.id);setF(Sel,'culture',true);commit(pick(LINES.read));break;
    case'cult-other':otherCulture(Sel);save();schedulePush();render();break;
    case'cult-own':setF(Sel,'cultureId',null);setF(Sel,'culture',true);commit(pick(LINES.read));break;
    case'cult-undo':setF(Sel,'culture',false);commit();break;
    case'gym':setF(Sel,'gym',!getDay(Sel).gym);commit(getDay(Sel).gym?LINES.gym[0]:null);break;
    case'mark':setFile(b.dataset.sid,+b.dataset.i,b.dataset.d||today());commit(pick(LINES.anot));break;
    case'unmark':setFile(b.dataset.sid,+b.dataset.i,null);commit();break;
    case'ses-pre':{const s=S.sessions[b.dataset.sid];s.files.forEach((f,i)=>{if(!f.done)setFile(s.id,i,'pre')});commit();toast('Marcada como ya anotada (sin XP)');break}
    case'ses-del':{const id=b.dataset.sid;if(SBUI.delArm===id){S.sessions[id].del=true;S.sessions[id].u=Date.now();SBUI.delArm=null;commit();toast('Sesión borrada')}else{SBUI.delArm=id;render()}break}
    case'sb-add':V='sb';render();setTimeout(()=>{const el=$('#imp-text');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.focus()}},50);break;
    case'sb-done':SBUI.showDone=!SBUI.showDone;render();break;
    case'imp-preview':SBUI.text=$('#imp-text').value;SBUI.fallback=$('#imp-date').value||today();SBUI.preview=parseTeams(SBUI.text,SBUI.fallback,today());render();break;
    case'imp-clear':SBUI.text='';SBUI.preview=null;render();break;
    case'imp-add':{const n=addSessions(SBUI.preview||[]);SBUI.text='';SBUI.preview=null;commit();toast(n?`${n} sesi${n===1?'ón agregada':'ones agregadas'}`:'Esas sesiones ya estaban');break}
    case'abs-ok':closeAbsence(false);break;
    case'abs-fix':closeAbsence(true);break;
    case'sync-now':pull();break;
    case'logout':if(SB)SB.auth.signOut();USER=null;SYNC.state='login';render();break;
    case'export':exportData();break;
    case'import':$('#importfile').click();break;
    case'reset':SBUI.reset=true;render();break;
    case'reset-no':SBUI.reset=false;render();break;
    case'reset-go':if(($('#resetin').value||'').trim().toUpperCase()==='SHADOW'){S=freshState();L.lossShown=null;SBUI.reset=false;save();if(SB&&USER)upsert().catch(()=>{});toast('Todo reiniciado');go('hoy')}else toast('Escribe SHADOW para confirmar.');break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.dataset.form==='steps'){
    const raw=$('#in-steps').value.replace(/[^\d]/g,'');
    $('#in-steps').blur();
    setF(Sel,'steps',raw===''?null:Math.min(200000,parseInt(raw,10)));
    commit(raw===''?null:pick(LINES.steps));
  }
  if(f.dataset.form==='goals'){
    const n=$('#g-name').value.trim()||'Yorsh',w=parseFloat($('#g-water').value),st=parseInt($('#g-steps').value,10),bo=parseInt($('#g-bonus').value,10);
    if(!(w>0)||!(st>0)||!(bo>=st)){toast('Revisa las metas: el bonus debe ser igual o mayor que la meta de pasos.');return}
    S.settings=Object.assign({},S.settings,{name:n,waterGoal:w,stepGoal:st,stepBonus:bo,u:Date.now()});commit();toast('Metas guardadas');
  }
  if(f.dataset.form==='login'){SYNC.msg='';login($('#lg-email').value.trim(),$('#lg-pass').value)}
});
document.addEventListener('input',e=>{if(e.target.id==='imp-text')SBUI.text=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='importfile'&&e.target.files[0]){importData(e.target.files[0]);e.target.value=''}});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  CurLine=homeLine();render();checkAbsence();
  if(SB&&USER)pull();
});
let LastT=today();
setInterval(()=>{const t=today();if(t!==LastT){LastT=t;Sel=t;CurLine=homeLine();render();checkAbsence()}},30000);

// ───────── Arranque ─────────
load();
if(S.createdAt>today())S.createdAt=today();
save();
$('#dogwrap').innerHTML=dogSVG();
recompute();
CurLine=homeLine();
render();
checkAbsence();
initSync();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
